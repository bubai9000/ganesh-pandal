 }

 }

 .flower {

 filter: drop-shadow(0 3px 12px rgba(0,0,0,0.85));

 }

 @keyframes rise {
 0% { transform: translateY(110vh) rotate(0deg) scale(0.6) translateX(0); opacity: 0; }
 15% { opacity: 0.95; }
 85% { opacity: 0.9; }
 100% { transform: translateY(-20vh) rotate(-320deg) scale(1.1) translateX(var(--drift)); opacity: 0; }
 }
