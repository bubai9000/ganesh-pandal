<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Pandal | Lalbaugcha Raja</title>
    <style>
        /* Import Elegant Serif and Modern Monospace fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #fff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; /* Removes blue tap highlight on mobile */
        }

        /* 1. Vintage Film Grain Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            opacity: 0.06;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        /* 2. Lalbaugcha Raja Watercolour Background */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* High-quality Watercolour prompt for Lalbaugcha Raja */
            background: url('https://image.pollinations.ai/prompt/beautiful%20watercolor%20painting%20of%20Lalbaugcha%20Raja%20Ganesha%20in%20a%20grand%20pandal%20festive%20atmosphere?width=1080&height=1920&nologo=true') no-repeat center center/cover;
            filter: brightness(0.2) saturate(1.2) contrast(1.1); 
            z-index: 1;
            transition: filter 3s cubic-bezier(0.25, 1, 0.5, 1);
            animation: slowZoom 30s infinite alternate ease-in-out;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Falling Flowers */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: fall linear infinite;
            filter: blur(1px);
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.6); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1); opacity: 0; }
        }

        /* 3. Main App UI Layout */
        .ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 60px 20px 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Elegant Divine Typography */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0;
            color: #ff6b6b; /* Vermillion Red / Sindoor color for Lalbaugcha Raja */
            letter-spacing: 2px;
            text-shadow: 0 4px 30px rgba(255, 107, 107, 0.5);
            animation: breathe 4s infinite alternate ease-in-out;
        }

        .header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: #ddd;
            margin-top: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes breathe {
            0% { opacity: 0.8; text-shadow: 0 4px 20px rgba(255, 107, 107, 0.2); }
            100% { opacity: 1; text-shadow: 0 4px 40px rgba(255, 107, 107, 0.7); }
        }

        /* 4. Interactive Player Card */
        .player-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .player-card {
            width: 100%;
            max-width: 400px;
            background: rgba(10, 10, 10, 0.5);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .track-info-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .track-info {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .now-playing-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: #ff6b6b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        .playlist-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
            letter-spacing: 1px;
        }

        /* Visualizer */
        .visualizer {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 24px;
        }

        .bar {
            width: 3px;
            background: #ff6b6b;
            border-radius: 2px;
            animation: bounce 1s infinite ease-in-out alternate;
        }

        .bar:nth-child(1) { animation-delay: 0.1s; height: 10px; }
        .bar:nth-child(2) { animation-delay: 0.3s; height: 24px; }
        .bar:nth-child(3) { animation-delay: 0.0s; height: 16px; }
        .bar:nth-child(4) { animation-delay: 0.4s; height: 20px; }

        @keyframes bounce {
            0% { transform: scaleY(0.3); opacity: 0.5; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        /* Player Controls (Interactive UI) */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .control-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .control-btn:active {
            transform: scale(0.9);
            color: #ff6b6b;
        }

        .control-btn.active-state {
            color: #ff6b6b;
        }

        /* 5. Minimalist Cinematic Entry Screen */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }

        .enter-text {
            font-family: 'Space Mono', monospace;
            color: #888;
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
        }

        .enter-btn {
            background: transparent;
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
            padding: 12px 40px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse-border 3s infinite;
        }

        .enter-btn:active {
            background: rgba(255, 107, 107, 0.1);
            transform: scale(0.98);
        }

        @keyframes pulse-border {
            0% { border-color: rgba(255, 107, 107, 0.2); text-shadow: 0 0 0 transparent; }
            50% { border-color: rgba(255, 107, 107, 0.8); text-shadow: 0 0 10px rgba(255, 107, 107, 0.5); }
            100% { border-color: rgba(255, 107, 107, 0.2); text-shadow: 0 0 0 transparent; }
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* Container for YouTube API */
        #yt-player-container {
            position: absolute;
            left: -9999px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <div id="entry-screen">
        <div class="enter-text">Lalbaugcha Raja<br><br>Put your headphones on</div>
        <button class="enter-btn" id="enter-btn">Enter</button>
    </div>

    <div class="bg-container" id="bg"></div>
    <div id="particles"></div>

    <div class="ui-container">
        
        <div class="header">
            <h1>Morya</h1>
            <p>Virtual Pandal • 2024</p>
        </div>

        <div class="player-wrapper">
            <div class="player-card">
                
                <div class="track-info-container">
                    <div class="track-info">
                        <p class="now-playing-label">Live Broadcast</p>
                        <p class="playlist-title">Ganesh Chaturthi Mix</p>
                    </div>
                    <div class="visualizer" id="visualizer">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                </div>

                <!-- Custom Interactive Controls -->
                <div class="controls">
                    <button class="control-btn" id="shuffle-btn">[ Shuffle ]</button>
                    <button class="control-btn" id="play-pause-btn">[ Pause ]</button>
                    <button class="control-btn" id="next-btn">[ Next ]</button>
                </div>

            </div>
        </div>

        <!-- Hidden YouTube API Player -->
        <div id="yt-player-container"></div>

    </div>

    <!-- Load YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // 1. Particle Generation (Red and Orange for Lalbaugcha Raja)
        function generateFlowers() {
            const container = document.getElementById('particles');
            const particleCount = window.innerWidth < 600 ? 20 : 40; 
            
            for(let i = 0; i < particleCount; i++) {
                let div = document.createElement('div');
                div.className = 'particle';
                div.style.left = (Math.random() * 100) + 'vw';
                let size = (Math.random() * 6 + 4);
                div.style.width = size + 'px';
                div.style.height = size + 'px';
                div.style.animationDuration = (Math.random() * 6 + 5) + 's';
                div.style.animationDelay = (Math.random() * 5) + 's';
                
                // Mix of deep orange and red
                div.style.backgroundColor = Math.random() > 0.5 ? 'rgba(255, 107, 107, 0.7)' : 'rgba(255, 140, 0, 0.7)';
                container.appendChild(div);
            }
        }
        window.onload = generateFlowers;

        // 2. YouTube API Setup
        let player;
        let isPlaying = false;
        const playlistId = 'PLc2iLHmAuYOk';

        // This function is automatically called by YouTube API when it loads
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player-container', {
                height: '0',
                width: '0',
                playerVars: {
                    listType: 'playlist',
                    list: playlistId,
                    autoplay: 0,
                    loop: 1,
                    controls: 0,
                    rel: 0
                }
            });
        }

        // 3. UI Interactions
        document.getElementById('enter-btn').addEventListener('click', () => {
            // Fade out entry screen & reveal background
            document.getElementById('entry-screen').classList.add('hidden');
            document.getElementById('bg').style.filter = 'brightness(0.55) saturate(1.1) contrast(1.1)';
            
            // Start the music via API
            if(player && typeof player.playVideo === 'function') {
                player.playVideo();
                isPlaying = true;
            }
        });

        // Next Button
        document.getElementById('next-btn').addEventListener('click', () => {
            if(player) {
                player.nextVideo();
                document.getElementById('play-pause-btn').innerText = '[ Pause ]';
                isPlaying = true;
                document.getElementById('visualizer').style.opacity = '1';
            }
        });

        // Shuffle Button
        document.getElementById('shuffle-btn').addEventListener('click', (e) => {
            if(player) {
                player.setShuffle(true);
                player.playVideoAt(0); // Forces it to jump to a random track
                e.target.classList.add('active-state'); // Turns the text red to show it is active
            }
        });

        // Play / Pause Button
        document.getElementById('play-pause-btn').addEventListener('click', (e) => {
            if(player) {
                if(isPlaying) {
                    player.pauseVideo();
                    e.target.innerText = '[ Play ]';
                    document.getElementById('visualizer').style.opacity = '0.3'; // Dim visualizer
                } else {
                    player.playVideo();
                    e.target.innerText = '[ Pause ]';
                    document.getElementById('visualizer').style.opacity = '1';
                }
                isPlaying = !isPlaying;
            }
        });
    </script>
</body>
</html>
