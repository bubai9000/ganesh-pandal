<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Pandal | Lalbaugcha Raja</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; 
            color: #d8c3a5; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 1. Heavy Film Grain Overlay (saloon.wtf style) */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            opacity: 0.08;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        /* 2. Pastel Watercolour Background */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Beautiful watercolour painting of Ganesha */
            background: url('https://image.pollinations.ai/prompt/pastel%20watercolour%20painting%20of%20Lalbaugcha%20Raja%20Ganesha%20in%20a%20pandal%20vintage%20aesthetic?width=1080&height=1920&nologo=true') no-repeat center center/cover;
            filter: brightness(0.15) sepia(0.4) saturate(0.6) contrast(1.2); 
            z-index: 1;
            transition: filter 3s cubic-bezier(0.25, 1, 0.5, 1);
            animation: slowZoom 30s infinite alternate ease-in-out;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* 3. Particles Layer for Offerings */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .flower {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: fall linear forwards;
            filter: blur(0.5px);
        }

        .sweet {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0;
            animation: fall linear forwards;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.6); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* 4. Main App UI */
        .ui-container {
            position: relative;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 50px 20px 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Header Typography */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.6rem;
            font-weight: 700;
            margin: 0;
            color: #d8c3a5; 
            letter-spacing: 2px;
            text-shadow: 0 4px 30px rgba(0,0,0,0.8);
        }

        .header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: #8e8d8a;
            margin-top: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* 5. Visible YouTube Player & Interactive Buttons */
        .bottom-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
        }

        .offerings-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .offer-btn {
            background: rgba(20, 18, 15, 0.6);
            border: 1px solid rgba(216, 195, 165, 0.2);
            color: #d8c3a5;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .offer-btn:active {
            transform: scale(0.95);
            background: rgba(216, 195, 165, 0.15);
            border-color: #d8c3a5;
        }

        /* Glassmorphism Wrapper for the Video */
        .video-card {
            width: 100%;
            max-width: 400px;
            background: rgba(10, 10, 10, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .youtube-embed {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .youtube-embed iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 6. Minimalist Cinematic Entry Screen */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease, visibility 1.5s ease;
        }

        .enter-text {
            font-family: 'Space Mono', monospace;
            color: #8e8d8a;
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.8;
        }

        .enter-btn {
            background: transparent;
            color: #d8c3a5;
            border: 1px solid rgba(216, 195, 165, 0.3);
            padding: 12px 40px;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse-border 3s infinite;
        }

        .enter-btn:active {
            background: rgba(216, 195, 165, 0.1);
            transform: scale(0.98);
        }

        @keyframes pulse-border {
            0% { border-color: rgba(216, 195, 165, 0.2); text-shadow: 0 0 0 transparent; }
            50% { border-color: rgba(216, 195, 165, 0.8); text-shadow: 0 0 10px rgba(216, 195, 165, 0.3); }
            100% { border-color: rgba(216, 195, 165, 0.2); text-shadow: 0 0 0 transparent; }
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- Grain Overlay -->
    <div class="noise-overlay"></div>

    <!-- Cinematic Entry Doorway -->
    <div id="entry-screen">
        <div class="enter-text">Lalbaugcha Raja<br>Virtual Pandal</div>
        <button class="enter-btn" onclick="enterPandal()">Enter</button>
    </div>

    <!-- Background and Animation Layers -->
    <div class="bg-container" id="bg"></div>
    <div id="particles"></div>

    <!-- Main App Interface -->
    <div class="ui-container">
        
        <div class="header">
            <h1>Morya</h1>
            <p>Est. 2024</p>
        </div>

        <div class="bottom-section">
            
            <!-- Interactive Offering Buttons -->
            <div class="offerings-container">
                <button class="offer-btn" onclick="offerFlowers()">[ Offer Flowers ]</button>
                <button class="offer-btn" onclick="offerSweets()">[ Offer Sweets ]</button>
            </div>

            <!-- Visible YouTube Player -->
            <div class="video-card">
                <div class="youtube-embed">
                    <!-- The iframe src is injected via JS to bypass mobile autoplay blocks -->
                    <iframe id="yt-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
            </div>

        </div>
    </div>

    <script>
        function enterPandal() {
            // Hide the entry screen
            document.getElementById('entry-screen').classList.add('hidden');
            
            // Brighten the background cinematic style
            document.getElementById('bg').style.filter = 'brightness(0.4) sepia(0.4) saturate(0.8) contrast(1.1)';

            // Load and Autoplay YouTube Playlist
            const playlistId = 'PLc2iLHmAuYOk'; 
            const iframe = document.getElementById('yt-player');
            // controls=1 ensures the user can see play/pause/next buttons clearly
            iframe.src = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1&loop=1&controls=1&rel=0&modestbranding=1`;
        }

        // Generate Falling Flowers on click
        function offerFlowers() {
            const container = document.getElementById('particles');
            const burstCount = 15; 
            
            for(let i = 0; i < burstCount; i++) {
                let div = document.createElement('div');
                div.className = 'flower';
                
                div.style.left = (Math.random() * 90 + 5) + 'vw';
                
                let size = (Math.random() * 8 + 5);
                div.style.width = size + 'px';
                div.style.height = size + 'px';
                
                div.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
                
                const colors = ['rgba(255, 140, 0, 0.8)', 'rgba(255, 215, 0, 0.8)', 'rgba(220, 20, 60, 0.8)'];
                div.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                container.appendChild(div);

                setTimeout(() => { div.remove(); }, 6000);
            }
        }

        // Generate Falling Modaks/Sweets on click
        function offerSweets() {
            const container = document.getElementById('particles');
            const burstCount = 6; 
            const sweetsList = ['🥟', '🟠', '🧆']; // Emoji representations of Indian sweets
            
            for(let i = 0; i < burstCount; i++) {
                let div = document.createElement('div');
                div.className = 'sweet';
                div.innerText = sweetsList[Math.floor(Math.random() * sweetsList.length)];
                
                div.style.left = (Math.random() * 80 + 10) + 'vw';
                div.style.animationDuration = (Math.random() * 3 + 3) + 's';
                
                container.appendChild(div);

                setTimeout(() => { div.remove(); }, 7000);
            }
        }
    </script>
</body>
</html>
