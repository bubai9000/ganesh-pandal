<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Pandal - Ganesh Chaturthi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            overflow: hidden; /* Prevents scrolling */
        }

        /* Ambient Background with Slow Zoom Animation */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1631438965625-f71694f4a3fb?q=80&w=1080&auto=format&fit=crop') no-repeat center center/cover;
            filter: brightness(0.3) sepia(0.6);
            z-index: 1;
            transition: filter 2s ease-in-out;
            animation: slowZoom 25s infinite alternate ease-in-out;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* Falling Flowers */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background-color: #FFA500;
            border-radius: 50%;
            opacity: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Main App UI */
        .ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 30px 20px;
            box-sizing: border-box;
            color: white;
            text-align: center;
        }

        /* Glowing Header Text Animation */
        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            color: #FFD700;
            letter-spacing: 1px;
            animation: textGlow 3s infinite alternate;
        }

        @keyframes textGlow {
            0% { text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
            100% { text-shadow: 0 4px 25px rgba(255, 215, 0, 0.8), 0 0 15px rgba(255, 140, 0, 0.6); }
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* Floating Glassmorphism Player Card */
        .player-card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }
            50% { transform: translateY(-12px); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
            100% { transform: translateY(0px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }
        }

        .youtube-embed {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
        }

        .youtube-embed iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Entry Screen */
        #entry-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #entry-screen h2 {
            color: #FFD700;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        #entry-screen p {
            color: #aaa;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .enter-btn {
            background: linear-gradient(135deg, #FF9933, #FF3300);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 102, 0, 0.4);
            transition: transform 0.2s;
            animation: pulse 2s infinite;
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 153, 51, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 153, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 153, 51, 0); }
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div id="entry-screen">
        <h2>Virtual Pandal</h2>
        <p>Put your headphones on.</p>
        <button class="enter-btn" onclick="enterPandal()">Enter</button>
    </div>

    <div class="bg-container" id="bg"></div>
    <div id="particles"></div>

    <div class="ui-container">
        <div class="header">
            <h1>Ganpati Bappa Morya!</h1>
            <p>Immersive Festive Vibes</p>
        </div>

        <div class="player-card">
            <p style="margin: 0 0 15px 0; font-size: 0.9rem; font-weight: 600; color: #FFD700; text-transform: uppercase; letter-spacing: 1px;">
                Now Playing
            </p>
            <div class="youtube-embed">
                <iframe id="yt-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        function generateFlowers() {
            const container = document.getElementById('particles');
            const particleCount = window.innerWidth < 600 ? 25 : 50; 
            
            for(let i = 0; i < particleCount; i++) {
                let div = document.createElement('div');
                div.className = 'particle';
                div.style.left = (Math.random() * 100) + 'vw';
                div.style.width = (Math.random() * 8 + 6) + 'px';
                div.style.height = div.style.width;
                div.style.animationDuration = (Math.random() * 5 + 4) + 's';
                div.style.animationDelay = (Math.random() * 5) + 's';
                div.style.backgroundColor = Math.random() > 0.5 ? '#FFA500' : '#FFD700';
                container.appendChild(div);
            }
        }

        function enterPandal() {
            const entryScreen = document.getElementById('entry-screen');
            entryScreen.classList.add('hidden');

            const bg = document.getElementById('bg');
            bg.style.filter = 'brightness(0.9) sepia(0.2)';

            const playlistId = 'PLc2iLHmAuYOk'; 
            const iframe = document.getElementById('yt-player');
            iframe.src = `https://www.youtube.com/embed/videoseries?list=${playlistId}&autoplay=1&loop=1&rel=0&modestbranding=1`;
        }

        window.onload = generateFlowers;
    </script>
</body>
</html>
